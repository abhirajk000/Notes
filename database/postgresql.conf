# ============================================================
# Secure Notes — PostgreSQL Low-Memory Profile
# Target: VPS with <200 MB total RAM (Postgres budget ~100 MB)
#
# Apply on Ubuntu/Debian:
#   sudo cp postgresql.conf /etc/postgresql/<version>/main/conf.d/secure-notes.conf
#   sudo systemctl restart postgresql
#
# Or append these lines to postgresql.conf and reload:
#   sudo systemctl reload postgresql
# ============================================================

# ── Memory ────────────────────────────────────────────────────
shared_buffers = 16MB
work_mem = 2MB
maintenance_work_mem = 8MB
effective_cache_size = 32MB
temp_buffers = 2MB

# ── Connections ───────────────────────────────────────────────
# Go API pool uses max 10; leave headroom for admin psql only.
max_connections = 10

# ── WAL / checkpoint (reduce I/O spikes on small VPS) ─────────
wal_buffers = 1MB
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_completion_target = 0.9

# ── Planner (low-memory hint) ─────────────────────────────────
random_page_cost = 1.1          # SSD VPS
effective_io_concurrency = 200

# ── Logging (minimal — saves disk + CPU) ────────────────────
log_min_duration_statement = 1000   # log queries > 1 s
log_connections = off
log_disconnections = off

# ── Autovacuum (gentle on small instances) ────────────────────
autovacuum_max_workers = 1
autovacuum_naptime = 60s
